# Sized for GitHub Actions runners (16 GB). A local build wants a machine with plenty of RAM.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# KSP2 hits "unexpected jvm signature V" on Room annotations with this toolchain.
ksp.useKSP2=false

# AGP 8.9 was released before API 36; Health Connect 1.1.0 needs compileSdk 36 (and AGP 8.9.1+).
android.suppressUnsupportedCompileSdk=36
